<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#174b39" />
    <title>You're offline · Money Bags</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f6f7f2;
        color: #263e34;
        font:
          1rem/1.55 system-ui,
          sans-serif;
      }
      main {
        max-width: 28rem;
        padding: 2rem;
        text-align: center;
      }
      img {
        width: 80px;
        height: 80px;
      }
      h1 {
        font-size: 1.75rem;
      }
      a {
        display: inline-block;
        padding: 0.7rem 1.2rem;
        border-radius: 0.75rem;
        background: #174b39;
        color: white;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>
        Money Bags needs an internet connection to load your budgets and save changes. Reconnect,
        then try again.
      </p>
      <a href="">Try again</a>
    </main>
  </body>
</html>
